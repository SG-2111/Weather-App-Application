<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgb(106, 163, 185), rgb(41, 78, 189));
            color: white;
            min-height: 100dvh;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main h1 {
            margin-bottom: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 12px;
            border-radius: 12px;
            width: 250px;
            font-size: 16px;
            text-align: center;
        }

        #weather-info {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .weather-card {
            background: rgba(245, 227, 227, 0.767);
            color: black;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 300px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .weather-card h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .temp {
            font-size: 40px;
            font-weight: bold;
            margin: 10px 0;
        }

        .desc {
            font-size: 18px;
            text-transform: capitalize;
        }

        button {
            padding: 17px;
            margin: 15px;
            font-weight: bold;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, rgb(236, 235, 185), rgb(172, 164, 95));
            color: black;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: cornflowerblue;
            box-shadow: 0 0 15px rgba(8, 8, 8, 0.8);
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>Weather Application Using Node js</h1>

        <div class="container">
            <h1>Weather Information</h1>

            <form id="loc-form">
                <input type="text" id="loc" placeholder="Enter the name of the city" required><br>
                <button type="submit">What's the Weather?</button>
            </form>

            <div id="weather-info"></div>

            <script>
                const weatherinfodiv = document.getElementById('weather-info');
                const locinput = document.getElementById('loc');

                document.getElementById('loc-form').addEventListener('submit', async (k) => {
                    k.preventDefault();

                    const loc = locinput.value;
                    const rep = await fetch(`/weather?loc=${encodeURIComponent(loc)}`);
                    const data = await rep.json();
                    console.log("Response received");
                    console.log(data);

                    if (!data.error) {
                        weatherinfodiv.innerHTML =
                            `<div class="weather-card">
                    <h2>${data.city}</h2>
                    <p class="temp">${data.temp}</p>
                    <p class="desc">${data.desc}</p>
                </div>`;
                    } else {
                        weatherinfodiv.innerHTML = `<p>${data.error}</p>`;
                    }
                });
            </script>
        </div>
    </div>
</body>

</html>
